name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Diagnostics
        run: |
          node -v
          npm -v

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Smoke test (自检门禁)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '12000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-data'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-data\selftest'
        run: |
          npx electron .
          $path = '${{ github.workspace }}\.ci-data\selftest\shot.json'
          if (!(Test-Path $path)) { throw '自检未生成诊断文件（应用可能启动失败）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          $errs = @($diag.errors)
          $fatal = @($errs | Where-Object { $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('自检发现运行时错误: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.llm) { throw '设置弹窗未能打开' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置菜单：关闭子页面后没有退回设置菜单' }
          if (-not $diag.themeCancelRestores) { throw '外观调色：点取消后主题预览没有还原' }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw 'Minecraft 伙伴：设置菜单里的入口打不开弹窗' }
          $opath = '${{ github.workspace }}\.ci-data\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '自检通过：无运行时错误，菜单行为与悬浮展台均正常'

      - name: Package (NSIS installer + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Smoke test packaged app (打包产物自检)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '10000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-pack'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-pack\selftest'
        run: |
          $path = '${{ github.workspace }}\.ci-pack\selftest\shot.json'
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          # GUI 程序用 & 调用不会等待，改为启动后轮询等待自检产物。
          # 自检顺序是 shot.json → overlay.json（展台还要多等 5 秒），两个都等到才算跑完，
          # 否则会在展台自检前就把进程杀掉，overlay.json 永远不生成。
          $proc = Start-Process -FilePath 'release\win-unpacked\AILEEN.exe' -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while ((-not (Test-Path $path) -or -not (Test-Path $opath)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          Start-Sleep -Seconds 2
          if (!(Test-Path $path)) { throw '打包产物无法启动（自检未生成诊断文件，通常是 files 白名单漏了文件）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          $fatal = @($diag.errors | Where-Object { $_ -and $_.Trim() -ne '' -and $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('打包产物运行时报错: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.menu) { throw '打包产物弹窗交互异常' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置菜单：关闭子页面后没有退回设置菜单' }
          if (-not $diag.themeCancelRestores) { throw '外观调色：点取消后主题预览没有还原' }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw 'Minecraft 伙伴：设置菜单里的入口打不开弹窗' }
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '打包产物自检通过（含悬浮展台）'

      - name: List output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name,Length

      - name: Create complete source zip
        shell: pwsh
        run: |
          git archive --format=zip --output="release/AILEEN-${{ github.ref_name }}-full-source.zip" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aileen-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
