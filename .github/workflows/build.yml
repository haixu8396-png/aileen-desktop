name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Diagnostics
        run: |
          node -v
          npm -v

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Smoke test (自检门禁)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '12000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-data'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-data\selftest'
        run: |
          # 门禁失败时把原因写成 ::error 注解 —— 否则日志要登录才看得到，
          # 而注解走 API 就能读（自检失败最耗时间的就是「只知道挂了不知道为什么」）
          trap { Write-Host "::error title=AILEEN 自检::$($_.Exception.Message)"; exit 1 }
          # 全新数据目录里一个角色都没有，而「人格必须留在提示词第一段」这条门禁需要
          # 一个真的角色卡。先放一张进去，否则测的是一个没人格的空壳。
          $chars = '${{ github.workspace }}\.ci-data\characters'
          New-Item -ItemType Directory -Force -Path $chars | Out-Null
          Copy-Item 'tests\fixtures\character-card.json' (Join-Path $chars 'smoke.json') -Force
          npx electron .
          $path = '${{ github.workspace }}\.ci-data\selftest\shot.json'
          if (!(Test-Path $path)) { throw '自检未生成诊断文件（应用可能启动失败）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          # 跑的就是要发的那个版本（防止发版漏改引用）
          $pkgVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($diag.appVersion -ne $pkgVersion) { throw ("版本不一致：应用报 $($diag.appVersion)，package.json 是 $pkgVersion")}
          $errs = @($diag.errors)
          $fatal = @($errs | Where-Object { $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('自检发现运行时错误: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.llm) { throw '设置页的「模型与连接」分类打不开' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置页：切换分类后没有停在设置页' }
          if (-not $diag.themeCancelRestores) { throw '外观：点取消后强调色预览没有还原' }
          if (-not $diag.themeModeOk) { throw '外观：浅色 / 暖暗色主题切换没有生效' }
          if (-not $diag.colorInstantOk) { throw ('外观：强调色没有即时生效（慢一拍）→ ' + ($diag.colorInstantDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw '设备页：Minecraft 面板打不开' }
          if (-not $diag.chessModalOk) { throw '国际象棋：设备页里的棋盘没有渲染出 64 格' }
          if (-not $diag.mainWindowHasNoStage) { throw '主窗口里出现了 Live2D 展台容器（角色应只在独立展台窗口）' }
          if (-not $diag.typingHidden) { throw '“正在回复…”指示器加载后没有隐藏（CSS 缺少 .hidden 规则）' }
          if (-not $diag.langOk) { throw 'i18n：界面语言与设置里的语言不一致' }
          if ($diag.i18nMissing -gt 0) { throw ('i18n：有 ' + $diag.i18nMissing + ' 处文案漏翻（显示成了 key 本身）') }
          if (-not $diag.langSwitchWorks) { throw 'i18n：语言切换没有真正生效' }
          if (-not $diag.uiElementsOk) { throw '界面：外壳（侧栏/输入区/设置导航/Agent 弹层）元素缺失' }
          if (-not $diag.pageNavOk) { throw '界面：主导航切换页面失败（一次只应显示一页）' }
          if (-not $diag.markerProbeOk) { throw ('对话内核：标记解析器在打包产物里不可用 → ' + ($diag.markerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.copyOk) { throw ('复制到剪贴板失败（应走主进程 clipboard）→ ' + ($diag.copyDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.copyUiOk) { throw ('复制入口不好找（必须在消息下面、常驻可见、点得到）→ ' + ($diag.copyUiDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.pacerProbeOk) { throw ('对话内核：回复节奏控制不可用 → ' + ($diag.pacerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.performOk) { throw ('表演设置不可调（设置分类打不开或保存不生效）→ ' + ($diag.performDetail | ConvertTo-Json -Compress)) }
          if (@($diag.uiBlockedBy).Count -gt 0) { throw ('界面被隐形元素遮挡，鼠标点不动 → ' + ($diag.uiBlockedBy -join ', ')) }
          if (-not $diag.personaOk) { throw ('自动生成人设不可用（解析或回填失败）→ ' + ($diag.personaDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.studioOk) { throw ('人设生成室不可用（入口/原型选择/锁定提示词）→ ' + ($diag.studioDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.noModelOk) { throw ('「不使用模型」没有真正清空展台 → ' + ($diag.noModelDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.scrollOk) { throw ('聊天消息区不能滚动 → ' + ($diag.scrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.settingsPersist) { throw ('API Key 出现在渲染层（必须只留 apiKeySet 标记）→ ' + ($diag.secretView | ConvertTo-Json -Compress)) }
          if (-not $diag.sideCollapseOk) { throw '界面：侧栏折叠不可用' }
          if (-not $diag.searchFilterOk) { throw '界面：角色搜索没有真正过滤列表' }
          if (-not $diag.hScrollOk) { throw ('页面出现横向滚动条（内容比视口宽，右侧会被切掉）→ ' + ($diag.hScrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.agentOk) { throw ('Agent 权限弹层或对话内活动卡不可用→ ' + ($diag.agentDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.panelReopenOk) { throw ('Agent 权限弹层收起后无法再打开 → ' + ($diag.panelReopenDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.dashOk) { throw ('对话内 Agent 活动卡或角色人格保留断言失败 → ' + ($diag.dashDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.toggleOk) { throw ('电脑控制开关没有立刻生效 / 输入区按钮不同步 → ' + ($diag.toggleDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.modelZipOk) { throw ('ZIP 导入 Live2D 模型不可用 → ' + ($diag.modelZipProbe | ConvertTo-Json -Compress)) }
          if (-not $diag.memoryOk) { throw ('记忆库真机往返失败（store:fs 写盘/读回/检索/删除）→ ' + ($diag.memoryProbe | ConvertTo-Json -Compress)) }
          if (-not $diag.checkpointOk) { throw ('Agent 检查点真机往返失败（保存/读回/清除）→ ' + ($diag.checkpointProbe | ConvertTo-Json -Compress)) }
          # 设置必须落在 AILEEN_DATA_DIR 下。写进源码目录 = settingsStore 在模块
          # 加载期就把路径钉死了（打包后那是 app.asar 里的路径，保存设置必然失败）。
          if (!(Test-Path '${{ github.workspace }}\.ci-data\data\settings.json')) { throw '设置没有写进 AILEEN_DATA_DIR（保存设置可能整个失效）' }
          if (Test-Path '${{ github.workspace }}\data\settings.json') { throw '设置被写进了源码目录 data/ —— settingsStore 在模块加载期就固定了 settingsFile' }
          if ($diag.jaMissingKeys -gt 0) { throw ('i18n：日文下仍有 ' + $diag.jaMissingKeys + ' 处回退成了 key') }
          $opath = '${{ github.workspace }}\.ci-data\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.hitMarginRight -lt 14 -or $ovr.hitMarginBottom -lt 14) { throw ('悬浮展台的交互热区离窗口边缘太近（右 ' + $ovr.hitMarginRight + 'px / 下 ' + $ovr.hitMarginBottom + 'px），会压到系统缩放手柄上导致拖动变成缩放') }
          if (-not $ovr.programmaticResizeOk) { throw '悬浮展台无法通过 −/＋ 调整尺寸' }
          if (-not $ovr.userResizeDisabled) { throw '悬浮展台必须禁止用户缩放：尺寸只能由 −/＋ 改' }
          if (-not $ovr.snapBackOk) { throw '悬浮展台尺寸被系统意外放大后没有弹回（Aero Snap 防护失效）' }
          if (-not $ovr.ignoringAfterResize) { throw '悬浮展台改过尺寸后不再是鼠标穿透状态（会把桌面点击全吃掉）' }
          if (-not $ovr.ignoringAfterMove) { throw '悬浮展台移动后不再是鼠标穿透状态' }
          if ($ovr.modelKeepsStateOk -eq $false) { throw ('改窗口尺寸后模型被重建了（动作/表情/口型会断）→ ' + ($ovr.modelKeepsStateProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.partPanelOk -eq $false) { throw ('部件面板没读出 cdi3 的部件名 → ' + ($ovr.partPanelProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.partToggleOk -eq $false) { throw ('部件开关没生效（隐藏后不透明度没有变 0）→ ' + ($ovr.partToggleProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.paramWriteOk -eq $false) { throw ('Live2D 参数写不进模型（按字符串 id 写只会写进幻影表，必须按下标）→ ' + ($ovr.paramWriteProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.expressionApplyOk -eq $false) { throw ('表达式没有真的改到模型参数，或关掉后没有还原成基线 → ' + ($ovr.expressionApplyProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.expressionMissingOk -eq $false) { throw ('表达式里引用了模型没有的参数却没报错（假成功）→ ' + ($ovr.expressionMissingProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.partRestoreOk -eq $false) { throw ('部件隐藏后恢复不回原来的不透明度（一律写 1 会让本来就半透明的部件变实）→ ' + ($ovr.partRestoreProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.live2dStateOk -eq $false) { throw ('Live2D 状态存取不一致（按模型持久化坏了）→ ' + ($ovr.live2dStateProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.propFitOk -eq $false) { throw ('道具出框的手动适配坏了（点「按当前姿势适配」后内容仍被裁，或者不该自动改却自动改了）→ ' + ($ovr.propFitProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.live2dLoadOk -eq $false) { throw ('Live2D 热键/部件状态加载失败（不能和「模型没有配置」混为一谈）→ ' + ($ovr.hotkeyProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyToggleOk -eq $false) { throw ('VTS 热键点了画面没变（引擎画出来的部件/绘制不透明度与关掉时一样）→ ' + ($ovr.hotkeyToggleProbe | ConvertTo-Json -Compress -Depth 5)) }
          if (-not $ovr.panelScrollOk) { throw ('「⋯」面板不能滚动（热键/部件下面那半截点不到）→ ' + ($ovr.panelScrollProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.panelInsideOk -eq $false) { throw ('「⋯」面板超出了窗口（贴到上沿外面，上面那截永远点不到）→ ' + ($ovr.panelScrollProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeOk) { throw ('展台窗口尺寸没有被钳住（可能铺满屏幕）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlayTaskbarGapOk) { throw ('展台底边贴着任务栏（角色的脚会踩在任务栏上）→ ' + ($ovr.overlayTaskbarGapProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlayInWorkAreaOk) { throw ('展台窗口露到工作区外（会挡住任务栏）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeResetOk) { throw ('展台大小复位失败（应回到默认档，且同样要过 clamp）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeBiggerOk) { throw ('展台尺寸上限没有放宽（用户反馈「最大值还是太小」）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragCoalesceOk) { throw ('拖动的高频移动没有被合并（IPC 会无上限积压）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragNoLiveMoveOk) { throw ('拖动过程中窗口应该原地不动（只留提示框）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragGhostOk) { throw ('拖动提示框没有跟手，或松手后没消失 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragPositionOk) { throw ('拖动后窗口位置没有跟到最新光标位置 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragSizeStableOk) { throw ('拖动过程中窗口宽高变了（尺寸被拉扯）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragNoResizeOk) { throw ('拖动期间窗口宽高被改了（会闪烁/尺寸抖动）→ ' + ($ovr.dragResizeLog | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragEndOk) { throw ('拖动结束后还有残留的动画帧/在途请求，或 dragEnd 被重复调用 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragNoResidualOk) { throw ('松手后窗口没有停在落点，或还在跟随光标 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragListenerOnceOk) { throw ('多次拖动后 IPC 次数翻倍（监听器被重复绑定）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if ($ovr.dragIgnoreRestored -ne $true) { throw '拖动结束后展台没有恢复鼠标穿透' }
          if (-not $ovr.dragPersistOk) { throw ('拖动后落盘的位置/尺寸不对（尺寸逐次变胖会让窗口越开越大）→ ' + ($ovr.dragPersistProbe | ConvertTo-Json -Compress)) }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          # 像素级断言只在真的装了模型时才有意义；CI 用全新数据目录，没有模型就退化成检查空状态
          if ($ovr.modelsAvailable -and -not $ovr.modelRenderedOk) { throw ('悬浮展台没有把模型画出来（帧缓冲为空）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.modelsAvailable -and -not $ovr.overlayEmptyOk) { throw ('没有安装模型时，悬浮展台应当显示空状态 → ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          # 换引擎（PixiJS v8 + untitled-pixi-live2d-engine）之后的硬约束：
          # 必须真的用上新引擎、Cubism Core 必须加载成功（否则 internalModel 根本挂不上）
          if (-not $ovr.overlayEngineOk) { throw ('展台没有用上新 Live2D 引擎（PixiJS v8 / untitled-pixi-live2d-engine）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.fineCtrlOk) { throw ('设置里的「Live2D 精细控制」没有生效（fps/fit 改了展台没跟上）→ ' + ($ovr.fineCtrlProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and -not $ovr.lipsyncOk) { throw ('口型同步没有驱动嘴部参数 → ' + ($ovr.lipsyncProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.mouthIpcOk) { throw ('口型的 IPC 通道不通（参数校验拒绝了 overlay:mouth）→ ' + ($ovr.mouthIpcProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and -not $ovr.fitFillsOk) { throw ('角色没有铺满展台窗口（按真实像素量的）→ ' + ($ovr.overlayProbe.fitDebug | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyListOk -eq $false) { throw ('模型自带的 VTS 热键没有读出来 → ' + ($ovr.hotkeyProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyToggleOk -eq $false) { throw ('VTS 热键开关/全部清除没有生效 → ' + ($ovr.hotkeyToggleProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.fullscreenAccelOk) { throw '全屏没有绑定 F11（视图菜单里的 togglefullscreen 缺 accelerator）' }
          if (-not $ovr.fullscreenToggleOk) { throw '窗口全屏开关无效' }
          if (-not $ovr.modelDeleteOk) { throw ('删除本地模型失败（临时模型目录没被删掉）→ ' + $ovr.modelDeleteBefore + ' / ' + $ovr.modelDeleteAfter) }
          if (-not $ovr.modelDeleteGuardOk) { throw ('删除模型的路径校验失效，越界路径被放行 → ' + ($ovr.modelDeleteGuard | ConvertTo-Json -Compress)) }
          if (-not $ovr.modelsSurvived) { throw '删除模型的测试把用户自己的模型也删掉了' }
          if (-not $ovr.secretRoundTripOk) { throw 'API Key 写入后读不回来（持久化坏了）' }
          if (-not $ovr.secretRedactedOk) { throw 'API Key 的明文泄漏到了渲染层设置里' }
          if (-not $ovr.secretKeepOnEmptyOk) { throw '「留空=保持密钥」的语义失效（改别的设置会把 Key 抹掉）' }
          if (-not $ovr.secretClearOk) { throw '「哨兵=清除密钥」的语义失效' }
          if (-not $ovr.secretRestored) { throw '自检没有把 API Key 还原回原值' }
          if ($ovr.secretEncryptedOk -ne $true -and $ovr.secretEncryptedOk -ne 'skipped:no-safeStorage') { throw ('API Key 没有加密落盘 → ' + $ovr.secretEncryptedOk) }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '自检通过：无运行时错误，菜单行为与悬浮展台均正常'

      - name: Package (NSIS installer + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Smoke test packaged app (打包产物自检)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '10000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-pack'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-pack\selftest'
        run: |
          trap { Write-Host "::error title=AILEEN 打包自检::$($_.Exception.Message)"; exit 1 }
          $chars = '${{ github.workspace }}\.ci-pack\characters'
          New-Item -ItemType Directory -Force -Path $chars | Out-Null
          Copy-Item 'tests\fixtures\character-card.json' (Join-Path $chars 'smoke.json') -Force
          $path = '${{ github.workspace }}\.ci-pack\selftest\shot.json'
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          # GUI 程序用 & 调用不会等待，改为启动后轮询等待自检产物。
          # 自检顺序是 shot.json → overlay.json（展台还要多等 5 秒），两个都等到才算跑完，
          # 否则会在展台自检前就把进程杀掉，overlay.json 永远不生成。
          $proc = Start-Process -FilePath 'release\win-unpacked\AILEEN.exe' -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while ((-not (Test-Path $path) -or -not (Test-Path $opath)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          Start-Sleep -Seconds 2
          if (!(Test-Path $path)) { throw '打包产物无法启动（自检未生成诊断文件，通常是 files 白名单漏了文件）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          $fatal = @($diag.errors | Where-Object { $_ -and $_.Trim() -ne '' -and $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('打包产物运行时报错: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.menu) { throw '打包产物弹窗交互异常' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置页：切换分类后没有停在设置页' }
          if (-not $diag.themeCancelRestores) { throw '外观：点取消后强调色预览没有还原' }
          if (-not $diag.themeModeOk) { throw '外观：浅色 / 暖暗色主题切换没有生效' }
          if (-not $diag.colorInstantOk) { throw ('外观：强调色没有即时生效（慢一拍）→ ' + ($diag.colorInstantDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw '设备页：Minecraft 面板打不开' }
          if (-not $diag.chessModalOk) { throw '国际象棋：设备页里的棋盘没有渲染出 64 格' }
          if (-not $diag.mainWindowHasNoStage) { throw '主窗口里出现了 Live2D 展台容器（角色应只在独立展台窗口）' }
          if (-not $diag.typingHidden) { throw '“正在回复…”指示器加载后没有隐藏（CSS 缺少 .hidden 规则）' }
          if (-not $diag.langOk) { throw 'i18n：界面语言与设置里的语言不一致' }
          if ($diag.i18nMissing -gt 0) { throw ('i18n：有 ' + $diag.i18nMissing + ' 处文案漏翻（显示成了 key 本身）') }
          if (-not $diag.langSwitchWorks) { throw 'i18n：语言切换没有真正生效' }
          if (-not $diag.uiElementsOk) { throw '界面：外壳（侧栏/输入区/设置导航/Agent 弹层）元素缺失' }
          if (-not $diag.pageNavOk) { throw '界面：主导航切换页面失败（一次只应显示一页）' }
          if (-not $diag.markerProbeOk) { throw ('对话内核：标记解析器在打包产物里不可用 → ' + ($diag.markerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.copyOk) { throw ('复制到剪贴板失败（应走主进程 clipboard）→ ' + ($diag.copyDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.copyUiOk) { throw ('复制入口不好找（必须在消息下面、常驻可见、点得到）→ ' + ($diag.copyUiDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.pacerProbeOk) { throw ('对话内核：回复节奏控制不可用 → ' + ($diag.pacerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.performOk) { throw ('表演设置不可调（设置分类打不开或保存不生效）→ ' + ($diag.performDetail | ConvertTo-Json -Compress)) }
          if (@($diag.uiBlockedBy).Count -gt 0) { throw ('界面被隐形元素遮挡，鼠标点不动 → ' + ($diag.uiBlockedBy -join ', ')) }
          if (-not $diag.personaOk) { throw ('自动生成人设不可用（解析或回填失败）→ ' + ($diag.personaDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.studioOk) { throw ('人设生成室不可用（入口/原型选择/锁定提示词）→ ' + ($diag.studioDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.noModelOk) { throw ('「不使用模型」没有真正清空展台 → ' + ($diag.noModelDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.scrollOk) { throw ('聊天消息区不能滚动 → ' + ($diag.scrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.settingsPersist) { throw ('API Key 出现在渲染层（必须只留 apiKeySet 标记）→ ' + ($diag.secretView | ConvertTo-Json -Compress)) }
          if (-not $diag.sideCollapseOk) { throw '界面：侧栏折叠不可用' }
          if (-not $diag.searchFilterOk) { throw '界面：角色搜索没有真正过滤列表' }
          if (-not $diag.hScrollOk) { throw ('页面出现横向滚动条（内容比视口宽，右侧会被切掉）→ ' + ($diag.hScrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.agentOk) { throw ('Agent 权限弹层或对话内活动卡不可用→ ' + ($diag.agentDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.panelReopenOk) { throw ('Agent 权限弹层收起后无法再打开 → ' + ($diag.panelReopenDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.dashOk) { throw ('对话内 Agent 活动卡或角色人格保留断言失败 → ' + ($diag.dashDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.toggleOk) { throw ('电脑控制开关没有立刻生效 / 输入区按钮不同步 → ' + ($diag.toggleDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.modelZipOk) { throw ('ZIP 导入 Live2D 模型不可用 → ' + ($diag.modelZipProbe | ConvertTo-Json -Compress)) }
          if (-not $diag.memoryOk) { throw ('打包产物里记忆库真机往返失败 → ' + ($diag.memoryProbe | ConvertTo-Json -Compress)) }
          if (-not $diag.checkpointOk) { throw ('打包产物里 Agent 检查点往返失败 → ' + ($diag.checkpointProbe | ConvertTo-Json -Compress)) }
          if ($diag.jaMissingKeys -gt 0) { throw ('i18n：日文下仍有 ' + $diag.jaMissingKeys + ' 处回退成了 key') }
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.hitMarginRight -lt 14 -or $ovr.hitMarginBottom -lt 14) { throw ('悬浮展台的交互热区离窗口边缘太近（右 ' + $ovr.hitMarginRight + 'px / 下 ' + $ovr.hitMarginBottom + 'px），会压到系统缩放手柄上导致拖动变成缩放') }
          if (-not $ovr.programmaticResizeOk) { throw '悬浮展台无法通过 −/＋ 调整尺寸' }
          if (-not $ovr.userResizeDisabled) { throw '悬浮展台必须禁止用户缩放：尺寸只能由 −/＋ 改' }
          if (-not $ovr.snapBackOk) { throw '悬浮展台尺寸被系统意外放大后没有弹回（Aero Snap 防护失效）' }
          if (-not $ovr.ignoringAfterResize) { throw '悬浮展台改过尺寸后不再是鼠标穿透状态（会把桌面点击全吃掉）' }
          if (-not $ovr.ignoringAfterMove) { throw '悬浮展台移动后不再是鼠标穿透状态' }
          if ($ovr.modelKeepsStateOk -eq $false) { throw ('改窗口尺寸后模型被重建了（动作/表情/口型会断）→ ' + ($ovr.modelKeepsStateProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.partPanelOk -eq $false) { throw ('部件面板没读出 cdi3 的部件名 → ' + ($ovr.partPanelProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.partToggleOk -eq $false) { throw ('部件开关没生效（隐藏后不透明度没有变 0）→ ' + ($ovr.partToggleProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.paramWriteOk -eq $false) { throw ('Live2D 参数写不进模型（按字符串 id 写只会写进幻影表，必须按下标）→ ' + ($ovr.paramWriteProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.expressionApplyOk -eq $false) { throw ('表达式没有真的改到模型参数，或关掉后没有还原成基线 → ' + ($ovr.expressionApplyProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.expressionMissingOk -eq $false) { throw ('表达式里引用了模型没有的参数却没报错（假成功）→ ' + ($ovr.expressionMissingProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.partRestoreOk -eq $false) { throw ('部件隐藏后恢复不回原来的不透明度（一律写 1 会让本来就半透明的部件变实）→ ' + ($ovr.partRestoreProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.live2dStateOk -eq $false) { throw ('Live2D 状态存取不一致（按模型持久化坏了）→ ' + ($ovr.live2dStateProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.propFitOk -eq $false) { throw ('道具出框的手动适配坏了（点「按当前姿势适配」后内容仍被裁，或者不该自动改却自动改了）→ ' + ($ovr.propFitProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.live2dLoadOk -eq $false) { throw ('Live2D 热键/部件状态加载失败（不能和「模型没有配置」混为一谈）→ ' + ($ovr.hotkeyProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyToggleOk -eq $false) { throw ('VTS 热键点了画面没变（引擎画出来的部件/绘制不透明度与关掉时一样）→ ' + ($ovr.hotkeyToggleProbe | ConvertTo-Json -Compress -Depth 5)) }
          if (-not $ovr.panelScrollOk) { throw ('「⋯」面板不能滚动（热键/部件下面那半截点不到）→ ' + ($ovr.panelScrollProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.panelInsideOk -eq $false) { throw ('「⋯」面板超出了窗口（贴到上沿外面，上面那截永远点不到）→ ' + ($ovr.panelScrollProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeOk) { throw ('展台窗口尺寸没有被钳住（可能铺满屏幕）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlayTaskbarGapOk) { throw ('展台底边贴着任务栏（角色的脚会踩在任务栏上）→ ' + ($ovr.overlayTaskbarGapProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlayInWorkAreaOk) { throw ('展台窗口露到工作区外（会挡住任务栏）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeResetOk) { throw ('展台大小复位失败（应回到默认档，且同样要过 clamp）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.overlaySizeBiggerOk) { throw ('展台尺寸上限没有放宽（用户反馈「最大值还是太小」）→ ' + ($ovr.overlaySizeProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragCoalesceOk) { throw ('拖动的高频移动没有被合并（IPC 会无上限积压）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragPositionOk) { throw ('拖动后窗口位置没有跟到最新光标位置 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragSizeStableOk) { throw ('拖动过程中窗口宽高变了（尺寸被拉扯）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragNoResizeOk) { throw ('拖动期间窗口宽高被改了（会闪烁/尺寸抖动）→ ' + ($ovr.dragResizeLog | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragEndOk) { throw ('拖动结束后还有残留的动画帧/在途请求，或 dragEnd 被重复调用 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragNoResidualOk) { throw ('松手后窗口没有停在落点，或还在跟随光标 → ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.dragListenerOnceOk) { throw ('多次拖动后 IPC 次数翻倍（监听器被重复绑定）→ ' + ($ovr.dragProbe | ConvertTo-Json -Compress)) }
          if ($ovr.dragIgnoreRestored -ne $true) { throw '拖动结束后展台没有恢复鼠标穿透' }
          if (-not $ovr.dragPersistOk) { throw ('拖动后落盘的位置/尺寸不对（尺寸逐次变胖会让窗口越开越大）→ ' + ($ovr.dragPersistProbe | ConvertTo-Json -Compress)) }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          # 像素级断言只在真的装了模型时才有意义；CI 用全新数据目录，没有模型就退化成检查空状态
          if ($ovr.modelsAvailable -and -not $ovr.modelRenderedOk) { throw ('悬浮展台没有把模型画出来（帧缓冲为空）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.modelsAvailable -and -not $ovr.overlayEmptyOk) { throw ('没有安装模型时，悬浮展台应当显示空状态 → ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          # 换引擎（PixiJS v8 + untitled-pixi-live2d-engine）之后的硬约束：
          # 必须真的用上新引擎、Cubism Core 必须加载成功（否则 internalModel 根本挂不上）
          if (-not $ovr.overlayEngineOk) { throw ('展台没有用上新 Live2D 引擎（PixiJS v8 / untitled-pixi-live2d-engine）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.fineCtrlOk) { throw ('设置里的「Live2D 精细控制」没有生效（fps/fit 改了展台没跟上）→ ' + ($ovr.fineCtrlProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and -not $ovr.lipsyncOk) { throw ('口型同步没有驱动嘴部参数 → ' + ($ovr.lipsyncProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.mouthIpcOk) { throw ('口型的 IPC 通道不通（参数校验拒绝了 overlay:mouth）→ ' + ($ovr.mouthIpcProbe | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and -not $ovr.fitFillsOk) { throw ('角色没有铺满展台窗口（按真实像素量的）→ ' + ($ovr.overlayProbe.fitDebug | ConvertTo-Json -Compress)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyListOk -eq $false) { throw ('模型自带的 VTS 热键没有读出来 → ' + ($ovr.hotkeyProbe | ConvertTo-Json -Compress -Depth 4)) }
          if ($ovr.modelsAvailable -and $ovr.hotkeyToggleOk -eq $false) { throw ('VTS 热键开关/全部清除没有生效 → ' + ($ovr.hotkeyToggleProbe | ConvertTo-Json -Compress)) }
          if (-not $ovr.fullscreenAccelOk) { throw '全屏没有绑定 F11（视图菜单里的 togglefullscreen 缺 accelerator）' }
          if (-not $ovr.fullscreenToggleOk) { throw '窗口全屏开关无效' }
          if (-not $ovr.modelDeleteOk) { throw ('删除本地模型失败（临时模型目录没被删掉）→ ' + $ovr.modelDeleteBefore + ' / ' + $ovr.modelDeleteAfter) }
          if (-not $ovr.modelDeleteGuardOk) { throw ('删除模型的路径校验失效，越界路径被放行 → ' + ($ovr.modelDeleteGuard | ConvertTo-Json -Compress)) }
          if (-not $ovr.modelsSurvived) { throw '删除模型的测试把用户自己的模型也删掉了' }
          if (-not $ovr.secretRoundTripOk) { throw 'API Key 写入后读不回来（持久化坏了）' }
          if (-not $ovr.secretRedactedOk) { throw 'API Key 的明文泄漏到了渲染层设置里' }
          if (-not $ovr.secretKeepOnEmptyOk) { throw '「留空=保持密钥」的语义失效（改别的设置会把 Key 抹掉）' }
          if (-not $ovr.secretClearOk) { throw '「哨兵=清除密钥」的语义失效' }
          if (-not $ovr.secretRestored) { throw '自检没有把 API Key 还原回原值' }
          if ($ovr.secretEncryptedOk -ne $true -and $ovr.secretEncryptedOk -ne 'skipped:no-safeStorage') { throw ('API Key 没有加密落盘 → ' + $ovr.secretEncryptedOk) }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '打包产物自检通过（含悬浮展台）'

      - name: List output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name,Length

      - name: Create complete source zip
        shell: pwsh
        run: |
          git archive --format=zip --output="release/AILEEN-${{ github.ref_name }}-full-source.zip" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aileen-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Generate release notes from CHANGELOG
        shell: pwsh
        run: node scripts/release-notes.mjs '${{ github.ref_name }}' .release-body.md

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 说明文字从 CHANGELOG 生成（新功能 + 下载表 + 协议）。
          # 不用 generate_release_notes：它只列提交标题，等于没写。
          body_path: .release-body.md
          files: |
            release/*.exe
            release/*.zip
