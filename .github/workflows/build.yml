name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Diagnostics
        run: |
          node -v
          npm -v

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Smoke test (自检门禁)
        shell: pwsh
        timeout-minutes: 5
        env:
          ELYSIA_SELFTEST: '1'
          ELYSIA_SELFTEST_MS: '12000'
          ELYSIA_DATA_DIR: '${{ github.workspace }}\.ci-data'
          ELYSIA_SELFTEST_DIR: '${{ github.workspace }}\.ci-data\selftest'
        run: |
          npx electron .
          $path = '${{ github.workspace }}\.ci-data\selftest\shot.json'
          if (!(Test-Path $path)) { throw '自检未生成诊断文件（应用可能启动失败）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          $errs = @($diag.errors)
          $fatal = @($errs | Where-Object { $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('自检发现运行时错误: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.llm) { throw '设置弹窗未能打开' }
          Write-Host '自检通过：无运行时错误，弹窗交互正常'

      - name: Package (NSIS installer + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: List output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name,Length

      - name: Create complete source zip
        shell: pwsh
        run: |
          git archive --format=zip --output="release/Elysia-${{ github.ref_name }}-full-source.zip" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elysia-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
