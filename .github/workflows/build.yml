name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Diagnostics
        run: |
          node -v
          npm -v

      - name: Unit tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Smoke test (自检门禁)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '12000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-data'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-data\selftest'
        run: |
          npx electron .
          $path = '${{ github.workspace }}\.ci-data\selftest\shot.json'
          if (!(Test-Path $path)) { throw '自检未生成诊断文件（应用可能启动失败）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          # 跑的就是要发的那个版本（防止发版漏改引用）
          $pkgVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($diag.appVersion -ne $pkgVersion) { throw ("版本不一致：应用报 $($diag.appVersion)，package.json 是 $pkgVersion")}
          $errs = @($diag.errors)
          $fatal = @($errs | Where-Object { $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('自检发现运行时错误: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.llm) { throw '设置弹窗未能打开' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置菜单：关闭子页面后没有退回设置菜单' }
          if (-not $diag.themeCancelRestores) { throw '外观调色：点取消后主题预览没有还原' }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw 'Minecraft 伙伴：设置菜单里的入口打不开弹窗' }
          if (-not $diag.chessModalOk) { throw '国际象棋：棋盘没有渲染出 64 格' }
          if (-not $diag.typingHidden) { throw '“正在思考…”指示器加载后没有隐藏（CSS 缺少 .hidden 规则）' }
          if (-not $diag.langOk) { throw 'i18n：默认语言不是英文' }
          if ($diag.i18nMissing -gt 0) { throw ('i18n：有 ' + $diag.i18nMissing + ' 处文案漏翻（显示成了 key 本身）') }
          if (-not $diag.langSwitchWorks) { throw 'i18n：语言切换没有真正生效' }
          if (-not $diag.uiElementsOk) { throw '界面：搜索框/折叠把手/重新生成/舞台换模型等元素缺失' }
          if (-not $diag.markerProbeOk) { throw ('对话内核：标记解析器在打包产物里不可用 → ' + ($diag.markerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.pacerProbeOk) { throw ('对话内核：回复节奏控制不可用 → ' + ($diag.pacerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.performOk) { throw ('表演设置不可调（弹窗打不开或保存不生效）→ ' + ($diag.performDetail | ConvertTo-Json -Compress)) }
          if (@($diag.uiBlockedBy).Count -gt 0) { throw ('界面被隐形元素遮挡，鼠标点不动 → ' + ($diag.uiBlockedBy -join ', ')) }
          if (-not $diag.personaOk) { throw ('自动生成人设不可用（解析或回填失败）→ ' + ($diag.personaDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.studioOk) { throw ('人设生成室不可用（入口/原型选择/锁定提示词）→ ' + ($diag.studioDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.noModelOk) { throw ('「不使用模型」没有真正清空舞台 → ' + ($diag.noModelDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.scrollOk) { throw ('聊天消息区不能滚动 → ' + ($diag.scrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.settingsPersist) { throw ('API Key 出现在渲染层（必须只留 apiKeySet 标记）→ ' + ($diag.secretView | ConvertTo-Json -Compress)) }
          if (-not $diag.sideCollapseOk) { throw '界面：侧栏折叠不可用' }
          if (-not $diag.searchFilterOk) { throw '界面：角色搜索没有真正过滤列表' }
          if (-not $diag.agentOk) { throw ('Agent 面板不可用（入口/控件/审批卡片）→ ' + ($diag.agentDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.dashOk) { throw ('Agent Dashboard 或角色人格保留断言失败 → ' + ($diag.dashDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.toggleOk) { throw ('电脑控制开关没有立刻切到控制模式 → ' + ($diag.toggleDetail | ConvertTo-Json -Compress)) }
          if ($diag.jaMissingKeys -gt 0) { throw ('i18n：日文下仍有 ' + $diag.jaMissingKeys + ' 处回退成了 key') }
          $opath = '${{ github.workspace }}\.ci-data\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.hitMarginRight -lt 14 -or $ovr.hitMarginBottom -lt 14) { throw ('悬浮展台的交互热区离窗口边缘太近（右 ' + $ovr.hitMarginRight + 'px / 下 ' + $ovr.hitMarginBottom + 'px），会压到系统缩放手柄上导致拖动变成缩放') }
          if (-not $ovr.programmaticResizeOk) { throw '悬浮展台无法通过 −/＋ 调整尺寸' }
          if (-not $ovr.userResizeDisabled) { throw '悬浮展台必须禁止用户缩放：尺寸只能由 −/＋ 改' }
          if (-not $ovr.snapBackOk) { throw '悬浮展台尺寸被系统意外放大后没有弹回（Aero Snap 防护失效）' }
          if (-not $ovr.ignoringAfterResize) { throw '悬浮展台改过尺寸后不再是鼠标穿透状态（会把桌面点击全吃掉）' }
          if (-not $ovr.ignoringAfterMove) { throw '悬浮展台移动后不再是鼠标穿透状态' }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          # 展台被误判成「手机」时，oh-my-live2d 会完全跳过模型加载 —— 这条任何环境都必须成立
          if ($ovr.overlayProbe.mqMobile -ne $false) { throw '悬浮展台被判定成了移动端（matchMedia 窗口宽度误判），模型会完全不加载' }
          # 像素级断言只在真的装了模型时才有意义；CI 用全新数据目录，没有模型就退化成检查空状态
          if ($ovr.modelsAvailable -and -not $ovr.modelRenderedOk) { throw ('悬浮展台没有把模型画出来（帧缓冲为空）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.modelsAvailable -and -not $ovr.overlayEmptyOk) { throw ('没有安装模型时，悬浮展台应当显示空状态 → ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.overlayMqOk) { throw '悬浮展台的平台判定异常' }
          if (-not $ovr.fullscreenAccelOk) { throw '全屏没有绑定 F11（视图菜单里的 togglefullscreen 缺 accelerator）' }
          if (-not $ovr.fullscreenToggleOk) { throw '窗口全屏开关无效' }
          if (-not $ovr.modelDeleteOk) { throw ('删除本地模型失败（临时模型目录没被删掉）→ ' + $ovr.modelDeleteBefore + ' / ' + $ovr.modelDeleteAfter) }
          if (-not $ovr.modelDeleteGuardOk) { throw ('删除模型的路径校验失效，越界路径被放行 → ' + ($ovr.modelDeleteGuard | ConvertTo-Json -Compress)) }
          if (-not $ovr.modelsSurvived) { throw '删除模型的测试把用户自己的模型也删掉了' }
          if (-not $ovr.secretRoundTripOk) { throw 'API Key 写入后读不回来（持久化坏了）' }
          if (-not $ovr.secretRedactedOk) { throw 'API Key 的明文泄漏到了渲染层设置里' }
          if (-not $ovr.secretKeepOnEmptyOk) { throw '「留空=保持密钥」的语义失效（改别的设置会把 Key 抹掉）' }
          if (-not $ovr.secretClearOk) { throw '「哨兵=清除密钥」的语义失效' }
          if (-not $ovr.secretRestored) { throw '自检没有把 API Key 还原回原值' }
          if ($ovr.secretEncryptedOk -ne $true -and $ovr.secretEncryptedOk -ne 'skipped:no-safeStorage') { throw ('API Key 没有加密落盘 → ' + $ovr.secretEncryptedOk) }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '自检通过：无运行时错误，菜单行为与悬浮展台均正常'

      - name: Package (NSIS installer + portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Smoke test packaged app (打包产物自检)
        shell: pwsh
        timeout-minutes: 5
        env:
          AILEEN_SELFTEST: '1'
          AILEEN_SELFTEST_OVERLAY: '1'
          AILEEN_SELFTEST_MS: '10000'
          AILEEN_DATA_DIR: '${{ github.workspace }}\.ci-pack'
          AILEEN_SELFTEST_DIR: '${{ github.workspace }}\.ci-pack\selftest'
        run: |
          $path = '${{ github.workspace }}\.ci-pack\selftest\shot.json'
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          # GUI 程序用 & 调用不会等待，改为启动后轮询等待自检产物。
          # 自检顺序是 shot.json → overlay.json（展台还要多等 5 秒），两个都等到才算跑完，
          # 否则会在展台自检前就把进程杀掉，overlay.json 永远不生成。
          $proc = Start-Process -FilePath 'release\win-unpacked\AILEEN.exe' -PassThru
          $deadline = (Get-Date).AddSeconds(180)
          while ((-not (Test-Path $path) -or -not (Test-Path $opath)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          Start-Sleep -Seconds 2
          if (!(Test-Path $path)) { throw '打包产物无法启动（自检未生成诊断文件，通常是 files 白名单漏了文件）' }
          $diag = Get-Content $path -Raw | ConvertFrom-Json
          $fatal = @($diag.errors | Where-Object { $_ -and $_.Trim() -ne '' -and $_ -notmatch 'live2d|Live2D|WebGL|pixi' })
          if ($fatal.Count -gt 0) { throw ('打包产物运行时报错: ' + ($fatal -join '; ')) }
          if (-not $diag.modalOpens.menu) { throw '打包产物弹窗交互异常' }
          if (-not $diag.subModalReturnsToMenu) { throw '设置菜单：关闭子页面后没有退回设置菜单' }
          if (-not $diag.themeCancelRestores) { throw '外观调色：点取消后主题预览没有还原' }
          if (-not $diag.mcStatusOk) { throw 'Minecraft 伙伴：主进程 IPC 不可用' }
          if (-not $diag.mcModalOk) { throw 'Minecraft 伙伴：设置菜单里的入口打不开弹窗' }
          if (-not $diag.chessModalOk) { throw '国际象棋：棋盘没有渲染出 64 格' }
          if (-not $diag.typingHidden) { throw '“正在思考…”指示器加载后没有隐藏（CSS 缺少 .hidden 规则）' }
          if (-not $diag.langOk) { throw 'i18n：默认语言不是英文' }
          if ($diag.i18nMissing -gt 0) { throw ('i18n：有 ' + $diag.i18nMissing + ' 处文案漏翻（显示成了 key 本身）') }
          if (-not $diag.langSwitchWorks) { throw 'i18n：语言切换没有真正生效' }
          if (-not $diag.uiElementsOk) { throw '界面：搜索框/折叠把手/重新生成/舞台换模型等元素缺失' }
          if (-not $diag.markerProbeOk) { throw ('对话内核：标记解析器在打包产物里不可用 → ' + ($diag.markerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.pacerProbeOk) { throw ('对话内核：回复节奏控制不可用 → ' + ($diag.pacerProbeDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.performOk) { throw ('表演设置不可调（弹窗打不开或保存不生效）→ ' + ($diag.performDetail | ConvertTo-Json -Compress)) }
          if (@($diag.uiBlockedBy).Count -gt 0) { throw ('界面被隐形元素遮挡，鼠标点不动 → ' + ($diag.uiBlockedBy -join ', ')) }
          if (-not $diag.personaOk) { throw ('自动生成人设不可用（解析或回填失败）→ ' + ($diag.personaDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.studioOk) { throw ('人设生成室不可用（入口/原型选择/锁定提示词）→ ' + ($diag.studioDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.noModelOk) { throw ('「不使用模型」没有真正清空舞台 → ' + ($diag.noModelDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.scrollOk) { throw ('聊天消息区不能滚动 → ' + ($diag.scrollDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.settingsPersist) { throw ('API Key 出现在渲染层（必须只留 apiKeySet 标记）→ ' + ($diag.secretView | ConvertTo-Json -Compress)) }
          if (-not $diag.sideCollapseOk) { throw '界面：侧栏折叠不可用' }
          if (-not $diag.searchFilterOk) { throw '界面：角色搜索没有真正过滤列表' }
          if (-not $diag.agentOk) { throw ('Agent 面板不可用（入口/控件/审批卡片）→ ' + ($diag.agentDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.dashOk) { throw ('Agent Dashboard 或角色人格保留断言失败 → ' + ($diag.dashDetail | ConvertTo-Json -Compress)) }
          if (-not $diag.toggleOk) { throw ('电脑控制开关没有立刻切到控制模式 → ' + ($diag.toggleDetail | ConvertTo-Json -Compress)) }
          if ($diag.jaMissingKeys -gt 0) { throw ('i18n：日文下仍有 ' + $diag.jaMissingKeys + ' 处回退成了 key') }
          $opath = '${{ github.workspace }}\.ci-pack\selftest\overlay.json'
          if (!(Test-Path $opath)) { throw '无边框悬浮展台自检未生成报告' }
          $ovr = Get-Content $opath -Raw | ConvertFrom-Json
          if (-not $ovr.opened) { throw '无边框悬浮展台没有创建窗口' }
          if (-not $ovr.visible) { throw '无边框悬浮展台窗口不可见' }
          if ($ovr.interactiveMode -eq $true) { throw '悬浮展台不应默认处于「角色可点击」模式' }
          if (-not $ovr.hitAreaSizeOk) { throw '悬浮展台没有上报有效的交互热区（右下角手柄）' }
          if ($ovr.hitMarginRight -lt 14 -or $ovr.hitMarginBottom -lt 14) { throw ('悬浮展台的交互热区离窗口边缘太近（右 ' + $ovr.hitMarginRight + 'px / 下 ' + $ovr.hitMarginBottom + 'px），会压到系统缩放手柄上导致拖动变成缩放') }
          if (-not $ovr.programmaticResizeOk) { throw '悬浮展台无法通过 −/＋ 调整尺寸' }
          if (-not $ovr.userResizeDisabled) { throw '悬浮展台必须禁止用户缩放：尺寸只能由 −/＋ 改' }
          if (-not $ovr.snapBackOk) { throw '悬浮展台尺寸被系统意外放大后没有弹回（Aero Snap 防护失效）' }
          if (-not $ovr.ignoringAfterResize) { throw '悬浮展台改过尺寸后不再是鼠标穿透状态（会把桌面点击全吃掉）' }
          if (-not $ovr.ignoringAfterMove) { throw '悬浮展台移动后不再是鼠标穿透状态' }
          if ($ovr.cursorInHit -eq $false -and $ovr.ignoringByDefault -ne $true) { throw '光标不在手柄上时，悬浮展台必须鼠标穿透，否则会挡住桌面操作' }
          if (-not $ovr.moved) { throw '悬浮展台无法移动' }
          if (-not $ovr.toolsExists) { throw '悬浮展台缺少右下角工具栏' }
          if ($ovr.mineflayer -ne $true) { throw ('打包产物里 mineflayer 不可用: ' + $ovr.mineflayer) }
          if ($ovr.pathfinder -ne $true) { throw ('打包产物里 mineflayer-pathfinder 不可用: ' + $ovr.pathfinder) }
          if (-not $ovr.gripExists) { throw '悬浮展台缺少拖拽手柄' }
          # 展台被误判成「手机」时，oh-my-live2d 会完全跳过模型加载 —— 这条任何环境都必须成立
          if ($ovr.overlayProbe.mqMobile -ne $false) { throw '悬浮展台被判定成了移动端（matchMedia 窗口宽度误判），模型会完全不加载' }
          # 像素级断言只在真的装了模型时才有意义；CI 用全新数据目录，没有模型就退化成检查空状态
          if ($ovr.modelsAvailable -and -not $ovr.modelRenderedOk) { throw ('悬浮展台没有把模型画出来（帧缓冲为空）→ ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.modelsAvailable -and -not $ovr.overlayEmptyOk) { throw ('没有安装模型时，悬浮展台应当显示空状态 → ' + ($ovr.overlayProbe | ConvertTo-Json -Compress -Depth 4)) }
          if (-not $ovr.overlayMqOk) { throw '悬浮展台的平台判定异常' }
          if (-not $ovr.fullscreenAccelOk) { throw '全屏没有绑定 F11（视图菜单里的 togglefullscreen 缺 accelerator）' }
          if (-not $ovr.fullscreenToggleOk) { throw '窗口全屏开关无效' }
          if (-not $ovr.modelDeleteOk) { throw ('删除本地模型失败（临时模型目录没被删掉）→ ' + $ovr.modelDeleteBefore + ' / ' + $ovr.modelDeleteAfter) }
          if (-not $ovr.modelDeleteGuardOk) { throw ('删除模型的路径校验失效，越界路径被放行 → ' + ($ovr.modelDeleteGuard | ConvertTo-Json -Compress)) }
          if (-not $ovr.modelsSurvived) { throw '删除模型的测试把用户自己的模型也删掉了' }
          if (-not $ovr.secretRoundTripOk) { throw 'API Key 写入后读不回来（持久化坏了）' }
          if (-not $ovr.secretRedactedOk) { throw 'API Key 的明文泄漏到了渲染层设置里' }
          if (-not $ovr.secretKeepOnEmptyOk) { throw '「留空=保持密钥」的语义失效（改别的设置会把 Key 抹掉）' }
          if (-not $ovr.secretClearOk) { throw '「哨兵=清除密钥」的语义失效' }
          if (-not $ovr.secretRestored) { throw '自检没有把 API Key 还原回原值' }
          if ($ovr.secretEncryptedOk -ne $true -and $ovr.secretEncryptedOk -ne 'skipped:no-safeStorage') { throw ('API Key 没有加密落盘 → ' + $ovr.secretEncryptedOk) }
          $overrs = @($ovr.errors | Where-Object { $_ -and $_.Trim() -ne '' })
          if ($overrs.Count -gt 0) { throw ('悬浮展台报错: ' + ($overrs -join '; ')) }
          Write-Host '打包产物自检通过（含悬浮展台）'

      - name: List output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name,Length

      - name: Create complete source zip
        shell: pwsh
        run: |
          git archive --format=zip --output="release/AILEEN-${{ github.ref_name }}-full-source.zip" HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aileen-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
