<div id="ov-root">
  <div id="ov-stage"></div>
  <div id="ov-tools" title="鼠标移到这里 · 静止几秒会自动隐藏">
    <button id="ov-smaller" title="缩小">−</button>
    <button id="ov-bigger" title="放大">＋</button>
    <button id="ov-lock" title="角色不挡鼠标（当前：穿透）">🖱</button>
    <div id="ov-grip" title="按住拖动位置"><span></span><span></span><span></span></div>

  </div>
</div>
