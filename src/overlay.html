<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http://127.0.0.1:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob: http://127.0.0.1:*; connect-src 'self' data: blob: http://127.0.0.1:* https:; media-src 'self' blob: data: http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self' data:" />
<title>AILEEN Stage</title>
<link rel="stylesheet" href="./overlay.css" />
</head>
<body>
<div id="ov-root">
  <div id="ov-stage"></div>
  <!-- 状态提示：聆听 / 思考 / 执行 / 等确认 —— 默认很淡，闲置时淡出 -->
  <div id="ov-status" class="ov-status hidden"></div>

  <!-- 悬浮 UI 都收在这个容器里：整块就是「交互热区」，
       收起时只剩工具条那么大，不会长期挡住桌面。 -->
  <div id="ov-ui">
    <!-- 小聊天面板：和主窗口共用同一段对话（只读展示 + 输入转交主窗口） -->
    <div id="ov-chat" class="ov-panel hidden">
      <div class="ov-panel-head">
        <span id="ov-char">AILEEN</span>
        <button id="ov-chat-close" data-i18n-title="overlay.hide"><span data-icon="close"></span></button>
      </div>
      <div id="ov-msgs"></div>
      <div class="ov-row">
        <input id="ov-input" type="text" autocomplete="off" data-i18n-ph="overlay.chatPlaceholder" />
        <button id="ov-send" class="primary" data-i18n-title="overlay.send"><span data-icon="send"></span></button>
      </div>
      <div class="ov-row ov-mini">
        <button id="ov-open-main" class="ov-link" data-i18n="overlay.continueMain">在主窗口中继续</button>
        <span id="ov-hint" class="ov-muted"></span>
      </div>
    </div>

    <!-- 热键（VTube Studio）/ 部件 / 动作 / 表情 / 模型 / 尺寸 -->
    <div id="ov-more" class="ov-panel hidden">
      <div id="ov-hotkey-sec" class="hidden">
        <div class="ov-label-row">
          <span class="ov-label" data-i18n="overlay.hotkeys">热键（VTS）</span>
          <button id="ov-hotkey-clear" class="ov-link" data-i18n="overlay.clearAll">全部清除</button>
        </div>
        <div id="ov-hotkeys" class="ov-chips"></div>
      </div>
      <div id="ov-parts-sec" class="hidden">
        <div class="ov-label-row">
          <span class="ov-label" data-i18n="overlay.parts">部件</span>
          <button id="ov-parts-reset" class="ov-link" data-i18n="overlay.partsAllOn">全部显示</button>
        </div>
        <div id="ov-parts" class="ov-chips"></div>
      </div>
      <div class="ov-label" data-i18n="overlay.motion">动作</div>
      <div id="ov-motions" class="ov-chips"></div>
      <div class="ov-label" data-i18n="overlay.expression">表情</div>
      <div id="ov-exprs" class="ov-chips"></div>
      <div class="ov-label" data-i18n="overlay.model">模型</div>
      <select id="ov-models"></select>
      <div class="ov-label" data-i18n="overlay.size">大小</div>
      <input id="ov-scale" type="range" min="0.4" max="1.25" step="0.05" />
      <div class="ov-label-row">
        <span class="ov-label" data-i18n="overlay.fit">画面适配</span>
        <button id="ov-fit-now" class="ov-link" data-i18n="overlay.fitNow">按当前姿势适配</button>
      </div>
      <div id="ov-fit-note" class="ov-muted hidden" data-i18n="overlay.fitClipHint">道具超出画面了，点上面的按钮重新适配</div>
    </div>

    <div id="ov-tools" data-i18n-title="overlay.toolsTitle">
      <button id="ov-chat-toggle" data-i18n-title="overlay.chatTip"><span data-icon="chat"></span></button>
      <button id="ov-mic" data-i18n-title="overlay.micTip"><span data-icon="mic"></span></button>
      <button id="ov-more-toggle" data-i18n-title="overlay.moreTip"><span data-icon="more"></span></button>
      <button id="ov-smaller" data-i18n-title="overlay.smaller"><span data-icon="minus"></span></button>
      <button id="ov-bigger" data-i18n-title="overlay.bigger"><span data-icon="plus"></span></button>
      <button id="ov-lock" data-i18n-title="overlay.lockOff"><span data-icon="pointer"></span></button>
      <button id="ov-main-btn" data-i18n-title="overlay.openMainTip"><span data-icon="window"></span></button>
      <div id="ov-grip" data-i18n-title="overlay.drag"><span></span><span></span><span></span></div>
      <button id="ov-hide" data-i18n-title="overlay.hide"><span data-icon="close"></span></button>
    </div>
    <!-- 右下角拖角把手：鼠标拖动直接改展台窗口大小（原生 resizable 保持关闭，避免和鼠标穿透打架） -->
    <div id="ov-resize" data-i18n-title="overlay.resizeTip"><span></span><span></span><span></span></div>
  </div>
</div>
<!--
  Cubism Core：Live2D 官方运行库（Live2D Proprietary Software License，
  但官方明确列入 RedistributableFiles —— 可以随应用一起分发，见 src/public/cubism/）。
  必须在 overlay.js（module）之前**同步**执行完：引擎初始化时会直接读 window.Live2DCubismCore。
-->
<script src="./cubism/live2dcubismcore.min.js"></script>
<script type="module" src="./overlay.js"></script>
</body>
</html>
